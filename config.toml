# ============================================
# 应用行为配置
# 部署相关配置（API 密钥、模型选择等）请在 .env 中设置
# ============================================

[consolidation]
# 整理 LLM 的温度：较低值保证输出稳定
temperature = 0.7
# 整理 LLM 最大 token 数：0 表示不限制
max_tokens = 0
# user.md 整理默认输出上限：避免沿用无限制配置导致高价模型直接报 402
player_profile_max_tokens = 2048
# growth.md 去重合并阈值：超过该条数才触发压缩，避免每轮重写
growth_dedup_threshold = 8

[vector]
# 向量检索返回条数
search_limit = 3
# 向量检索固定候选数
vector_candidate_limit = 15
# rerank 后保留条数，再做 recency
rerank_top_n = 10
# relevance 权重
relevance_weight = 0.5
# recency 权重
recency_weight = 0.2
# importance 权重（来自 memory.md 中的“重要度”）
importance_weight = 0.3
# 游戏内时间半衰期（天）
recency_half_life_days = 5.0
# recency 内部权重：按加权平均融合日期与 recall 两个信号，设为 0 可禁用对应信号
recency_date_weight = 0.7
recency_recall_weight = 0.3
# 混合检索：BM25 关键字检索 + 加权融合
hybrid_search_enabled = true
# BM25 初筛候选数
bm25_candidate_limit = 15
# hybrid relevance 内部权重：vector vs BM25
vector_relevance_weight = 0.75
bm25_relevance_weight = 0.25

[history]
# 多轮消息高低水位截断：超过 high 时截到 low，批量截断利于 prefix cache
history_high = 40
history_low = 15

[agent]
# Agent LLM 调用超时（秒）
run_timeout_seconds = 120
# Agent 对话温度（deepseek 建议 1.3）
temperature = 1.3

[text]
# 角色回复后处理：最多保留的动作描写数（括号内容）
max_actions = 3
# 角色回复后处理：最多保留的省略号数
max_ellipsis = 3
