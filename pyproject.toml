[project]
name = "memobot"
version = "0.1.0"
description = "A chatbot with long-term memory and personal customization"
requires-python = ">=3.11"
dependencies = [
    "agno>=0.9.0",
    "chainlit>=2.0",
    "openai>=1.0",
    "sqlite-vec>=0.1",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

