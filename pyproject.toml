[project]
name = "AgentGal"
version = "0.1.0"
description = "A chatbot with long-term memory and personal customization"
requires-python = ">=3.11"
dependencies = [
    "agno>=0.9.0",
    "chainlit>=2.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "evermemos>=0.1.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "bcrypt",
    "gradio",
    "sseclient"
]

[project.optional-dependencies]
local-vec = [
    "sqlite-vec>=0.1.6",
    "aiosqlite>=0.22.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
